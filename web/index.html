<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>senes</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f2328">
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --muted: #8b949e; --line: #eaeef2; --card: #fff; --hover: #f6f8fa;
    --accent: #1f2328;
    --open: #1a7f37; --draft: #59636e; --merged: #8250df; --closed: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #7d8590; --line: #21262d; --card: #0d1117; --hover: #161b22;
      --accent: #e6edf3;
      --open: #3fb950; --draft: #9198a1; --merged: #ab7df8; --closed: #f85149;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--muted); }
  a:hover { text-decoration-color: currentColor; }
  button, input, textarea { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 24px; padding: 28px 32px 8px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #quick { flex: 1; max-width: 520px; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 0; outline: none; }
  #quick:focus { border-bottom-color: var(--fg); }
  #quick::placeholder { color: var(--muted); }

  main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding: 16px 32px 48px; }
  @media (max-width: 900px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { main { grid-template-columns: minmax(0, 1fr); } header, main { padding-left: 16px; padding-right: 16px; } }

  .col { min-height: 120px; border-radius: 8px; transition: background .12s; }
  .col.over { background: var(--hover); }
  .col h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; padding: 0 2px; font-size: 12px; font-weight: 500; text-transform: lowercase; letter-spacing: .08em; color: var(--muted); }
  .col h2 .n { font-variant-numeric: tabular-nums; opacity: .7; }
  .col[data-status="doing"] h2 { color: var(--fg); }
  .col h2 { cursor: pointer; user-select: none; }
  .col h2:hover { color: var(--fg); }
  .col h2 .chev { display: inline-block; width: 8px; transition: transform .12s; }
  .col.collapsed h2 .chev { transform: rotate(-90deg); }
  .col.collapsed .card, .col.collapsed .empty { display: none; }

  .card { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 8px; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--muted); }
  .card.dragging { opacity: .4; }
  .drop-mark { height: 2px; margin: -5px 0 3px; border-radius: 1px; background: var(--fg); pointer-events: none; }
  .card .head { display: flex; align-items: baseline; gap: 6px; }
  .card .id { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .card .title { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  .card .desc { margin-top: 4px; color: var(--muted); font-size: 13px; max-height: 9.5em; overflow: hidden; overflow-wrap: anywhere;
    -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
  .card .desc:not(.long) { -webkit-mask-image: none; mask-image: none; }
  .col[data-status="done"] .card .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 .5em; }
  .md > :last-child { margin-bottom: 0; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.3em; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 1em; margin: .4em 0 .3em; }
  .md code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: .1em .35em; border-radius: 4px; }
  .md pre { background: var(--hover); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); }
  .md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--line); padding: 2px 6px; }

  a.pr { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px 0 4px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: .92em;
    color: var(--draft); background: color-mix(in srgb, currentColor 10%, transparent); vertical-align: baseline; }
  a.pr svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
  a.pr.open { color: var(--open); } a.pr.draft { color: var(--draft); } a.pr.merged { color: var(--merged); } a.pr.closed { color: var(--closed); }
  a.pr.unknown { opacity: .6; outline: 1px dashed currentColor; outline-offset: -1px; }
  a.pr:hover { background: color-mix(in srgb, currentColor 18%, transparent); }
  a.pr { max-width: 100%; overflow: hidden; }
  a.pr .pr-num { flex: none; white-space: nowrap; }
  a.pr .pr-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; color: var(--fg); }

  dialog { width: min(640px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--bg); color: var(--fg); box-shadow: 0 16px 48px rgba(0,0,0,.12); }
  dialog::backdrop { background: rgba(0,0,0,.18); }
  dialog form { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
  #f-title { border: 0; outline: none; background: transparent; font-size: 17px; font-weight: 600; padding: 0; }
  #f-desc { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 200px; resize: vertical; outline: none; background: transparent;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #f-desc:focus { border-color: var(--muted); }
  #f-preview { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 200px; max-height: 60vh; overflow: auto; overflow-wrap: anywhere; }
  #f-preview:empty::before { content: "Nothing to preview"; color: var(--muted); }
  .desc-wrap { display: flex; flex-direction: column; gap: 6px; }
  .desc-wrap.preview #f-desc, .desc-wrap:not(.preview) #f-preview { display: none; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { border: 0; background: transparent; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { color: var(--fg); background: var(--hover); }
  .meta { display: flex; align-items: center; gap: 12px; }
  #f-id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 4px; }
  .seg label { cursor: pointer; }
  .seg input { display: none; }
  .seg span { display: inline-block; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
  .seg input:checked + span { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 8px; }
  .actions .spacer { flex: 1; }
  .actions .hint { font-size: 12px; color: var(--muted); }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn.danger { color: var(--closed); border-color: transparent; padding-left: 0; }
  .btn.danger:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 2px; opacity: .6; }
</style>
</head>
<body>
<header>
  <h1>senes</h1>
  <input id="quick" placeholder="New task — Enter to add" autocomplete="off">
</header>
<main id="board"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <input id="f-title" placeholder="Title" required autocomplete="off">
    <div class="meta"><span id="f-id"></span><div class="seg" id="f-status"></div></div>
    <div class="desc-wrap" id="f-desc-wrap">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="edit" aria-selected="true">Edit</button>
        <button type="button" role="tab" data-mode="preview" aria-selected="false">Preview</button>
      </div>
      <textarea id="f-desc" placeholder="Description (markdown)"></textarea>
      <div id="f-preview" class="md"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="f-delete">Delete</button>
      <span class="spacer"></span>
      <span class="hint">⌘↩ to save</span>
      <button type="button" class="btn" id="f-cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const STATUSES = ["doing", "todo", "waiting", "backlog", "done"];
const ICONS = {
  open: "M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z",
  draft: "M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 14a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5ZM2.5 3.25a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm9.5 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM14 7.5a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Zm0-4.25a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Z",
  merged: "M5.45 5.154A4.25 4.25 0 0 0 9.25 7.5h1.378a2.251 2.251 0 1 1 0 1.5H9.25A5.734 5.734 0 0 1 5 7.123v3.505a2.25 2.25 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.95-.218ZM4.25 13.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm8.5-4.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM5 3.25a.75.75 0 1 0 0 .005V3.25Z",
  closed: "M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 5.5a.75.75 0 0 1 .75.75v3.378a2.251 2.251 0 1 1-1.5 0V7.25a.75.75 0 0 1 .75-.75Zm-2.03-5.273a.75.75 0 0 1 1.06 0l.97.97.97-.97a.748.748 0 0 1 1.265.332.75.75 0 0 1-.205.729l-.97.97.97.97a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-.97-.97-.97.97a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l.97-.97-.97-.97a.75.75 0 0 1 0-1.06ZM2.5 3.25a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0ZM3.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm9.5 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z",
};
ICONS.unknown = "M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.92 6.085h.001a.749.749 0 1 1-1.342-.67c.169-.339.436-.701.849-.977C6.845 4.16 7.369 4 8 4a2.756 2.756 0 0 1 1.637.525c.503.377.863.965.863 1.725 0 .448-.115.83-.329 1.15-.205.307-.47.513-.692.662-.109.072-.22.138-.313.195l-.006.004a6.24 6.24 0 0 0-.26.16.952.952 0 0 0-.276.245.75.75 0 0 1-1.248-.832c.184-.264.42-.489.692-.661.103-.067.207-.132.313-.195l.007-.004c.1-.061.182-.11.258-.161a.969.969 0 0 0 .277-.245C8.96 6.514 9 6.427 9 6.25a.612.612 0 0 0-.262-.525A1.27 1.27 0 0 0 8 5.5c-.369 0-.595.09-.74.187a1.01 1.01 0 0 0-.34.398ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z";

const $ = (s, el = document) => el.querySelector(s);
const board = $("#board"), dlg = $("#dlg");
let tasks = [], editing = null, prCache = {}, dragging = false;
// Per-status collapse state; backlog and done start collapsed.
const collapsed = Object.assign({ done: true, backlog: true }, JSON.parse(localStorage.getItem("senes.collapsed") || "{}"));

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); alert(e.error || res.statusText); throw new Error(e.error); }
  return res.status === 204 ? null : res.json();
}

async function load() {
  tasks = await api("GET", "/api/tasks");
  render();
}

function render() {
  board.replaceChildren(...STATUSES.map(st => {
    const items = tasks.filter(t => t.status === st);
    const col = document.createElement("section");
    col.className = "col" + (collapsed[st] ? " collapsed" : ""); col.dataset.status = st;
    col.innerHTML = `<h2><span class="chev">▾</span>${st}<span class="n">${items.length}</span></h2>`;
    $("h2", col).addEventListener("click", () => {
      collapsed[st] = col.classList.toggle("collapsed");
      localStorage.setItem("senes.collapsed", JSON.stringify(collapsed));
    });
    for (const t of items) col.append(card(t));
    if (!items.length) col.insertAdjacentHTML("beforeend", `<div class="empty">—</div>`);
    col.addEventListener("dragover", e => {
      e.preventDefault(); col.classList.add("over");
      const before = dropTarget(col, e.clientY);
      if (before) before.before(dropMark); else if (collapsed[st]) dropMark.remove(); else (col.querySelector(".card:last-of-type") || $("h2", col)).after(dropMark);
    });
    col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) { col.classList.remove("over"); dropMark.remove(); } });
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("over"); dropMark.remove();
      const id = +e.dataTransfer.getData("text/plain");
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      const beforeEl = dropTarget(col, e.clientY);
      const rest = tasks.filter(x => x.id !== id);
      const others = rest.filter(x => x.status === st);
      const body = {};
      if (t.status !== st) body.status = st;
      if (beforeEl) body.before = +beforeEl.dataset.id;
      else if (others.length) body.after = others[others.length - 1].id;
      // Skip when the task would land where it already is.
      const cur = tasks.filter(x => x.status === st);
      const idx = cur.indexOf(t);
      if (!body.status && (body.before ? cur[idx + 1]?.id === body.before : idx === cur.length - 1)) return;
      // Optimistic reorder.
      const anchor = body.before ?? body.after;
      let at = anchor ? rest.findIndex(x => x.id === anchor) + (body.before ? 0 : 1) : rest.length;
      t.status = st; rest.splice(at, 0, t); tasks = rest; render();
      await api("PATCH", `/api/tasks/${id}`, body);
      load();
    });
    return col;
  }));
  decoratePRs();
}

const dropMark = Object.assign(document.createElement("div"), { className: "drop-mark" });

// Returns the card the dragged item should be inserted before (null = end of column).
function dropTarget(col, y) {
  if (col.classList.contains("collapsed")) return null;
  for (const c of col.querySelectorAll(".card:not(.dragging)")) {
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) return c;
  }
  return null;
}

function card(t) {
  const el = document.createElement("article");
  el.className = "card"; el.draggable = true; el.dataset.id = t.id;
  el.innerHTML = `<div class="head"><span class="id">#${t.id}</span><div class="title md">${t.title_html}</div></div>` + (t.description ? `<div class="desc md">${t.description_html}</div>` : "");
  el.addEventListener("click", e => { if (!e.target.closest("a, input")) openEditor(t); });
  el.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", t.id); el.classList.add("dragging"); dragging = true; });
  el.addEventListener("dragend", () => { el.classList.remove("dragging"); dropMark.remove(); dragging = false; flush(); });
  for (const a of el.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  requestAnimationFrame(() => { const d = $(".desc", el); if (d && d.scrollHeight > d.clientHeight) d.classList.add("long"); });
  return el;
}

async function decoratePRs(root = board) {
  const links = [...root.querySelectorAll("a[data-pr]")];
  if (!links.length) return;
  // PRs in done tasks are not fetched; they only show a cached state if one exists.
  const active = links.filter(a => !a.closest('.col[data-status="done"]'));
  const missing = [...new Set(active.map(a => a.dataset.pr))].filter(r => !prCache[r]);
  links.forEach(applyPR);
  if (!missing.length) return;
  // The server accepts at most 50 refs per request.
  const chunks = [];
  for (let i = 0; i < missing.length; i += 50) chunks.push(missing.slice(i, i + 50));
  const results = await Promise.all(chunks.map(c =>
    fetch("/api/prs?" + c.map(r => "ref=" + encodeURIComponent(r)).join("&")).then(r => r.json()).catch(() => ({}))));
  results.forEach(res => Object.assign(prCache, res));
  root.querySelectorAll("a[data-pr]").forEach(applyPR);
}

function applyPR(a) {
  const ref = a.dataset.pr, st = prCache[ref];
  const [owner, repo, num] = ref.split("/");
  if (!a.dataset.decorated) {
    a.dataset.decorated = "1";
    a.classList.add("pr");
    // Shorten bare URLs to repo#123.
    if (a.textContent.trim() === a.getAttribute("href")) {
      a.dataset.bare = "1";
      a.innerHTML = `<span class="pr-num"></span>`;
      a.firstChild.textContent = `${repo}#${num}`;
    }
    a.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 16 16" aria-hidden="true"><path></path></svg>`);
  }
  // Expand the PR title next to bare URLs once it is known.
  if (a.dataset.bare && st && st.title) {
    let t = $(".pr-title", a);
    if (!t) { t = document.createElement("span"); t.className = "pr-title"; a.append(t); }
    t.textContent = st.title;
  }
  const state = st ? st.state : "unknown";
  a.classList.remove("open", "draft", "merged", "closed", "unknown");
  a.classList.add(state);
  $("path", a).setAttribute("d", ICONS[state] || ICONS.open);
  const label = state === "unknown" ? "unknown（取得失敗）" : state;
  a.title = `${owner}/${repo}#${num} · ${label}` + (st && st.title ? `\n${st.title}` : "");
}

// --- editor ---
$("#f-status").innerHTML = STATUSES.map(s => `<label><input type="radio" name="status" value="${s}"><span>${s}</span></label>`).join("");

function openEditor(t) {
  editing = t;
  $("#f-id").textContent = `#${t.id}`;
  $("#f-title").value = t.title;
  $("#f-desc").value = t.description;
  $(`#f-status input[value="${t.status}"]`).checked = true;
  setDescMode(t.description.trim() ? "preview" : "edit");
  dlg.showModal();
  $("#f-title").blur();
}

// Description edit / preview toggle.
let previewSeq = 0;
async function setDescMode(mode) {
  const wrap = $("#f-desc-wrap"), pv = $("#f-preview");
  wrap.classList.toggle("preview", mode === "preview");
  for (const b of wrap.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.mode === mode);
  if (mode !== "preview") { pv.replaceChildren(); return; }
  const seq = ++previewSeq, src = $("#f-desc").value;
  const { html } = src.trim() ? await api("POST", "/api/render", { markdown: src }) : { html: "" };
  if (seq !== previewSeq || !wrap.classList.contains("preview")) return;
  pv.innerHTML = html;
  for (const a of pv.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  decoratePRs(pv);
}
for (const b of $("#f-desc-wrap").querySelectorAll(".tabs button")) b.onclick = () => setDescMode(b.dataset.mode);

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    title: $("#f-title").value.trim(),
    description: $("#f-desc").value,
    status: $("#f-status input:checked").value,
  };
  await api("PATCH", `/api/tasks/${editing.id}`, body);
  dlg.close(); load();
});
$("#f-cancel").onclick = () => dlg.close();
$("#f-delete").onclick = async () => {
  if (!confirm(`Delete "${editing.title}"?`)) return;
  await api("DELETE", `/api/tasks/${editing.id}`);
  dlg.close(); load();
};
dlg.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#form").requestSubmit(); }
  // ⌘⇧P toggles edit / preview.
  if (e.key.toLowerCase() === "p" && e.shiftKey && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    const toPreview = !$("#f-desc-wrap").classList.contains("preview");
    setDescMode(toPreview ? "preview" : "edit");
    if (!toPreview) $("#f-desc").focus();
  }
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { editing = null; flush(); });

// --- quick add ---
$("#quick").addEventListener("keydown", async e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const title = e.target.value.trim();
  if (!title) return;
  e.target.value = "";
  await api("POST", "/api/tasks", { title, status: "todo" });
  load();
});

// Keep in sync with CLI changes: the server pushes a "change" event via SSE.
// While editing / dragging / hidden, the reload is deferred until it is safe.
let stale = false;
function sync() {
  if (editing || dragging || document.hidden) { stale = true; return; }
  stale = false; load();
}
function flush() { if (stale) sync(); }
const es = new EventSource("/api/events");
es.addEventListener("change", sync);
// Reload on reconnect to catch changes missed while disconnected.
let connected = false;
es.addEventListener("open", () => { if (connected) sync(); connected = true; });
document.addEventListener("visibilitychange", flush);
// Expire non-final PR states; merged/closed are kept since they won't change.
setInterval(() => {
  for (const [ref, st] of Object.entries(prCache)) if (st.state !== "merged" && st.state !== "closed") delete prCache[ref];
}, 120000);

load();
</script>
</body>
